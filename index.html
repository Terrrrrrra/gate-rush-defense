<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <title>Gate Rush Defense</title>
    <meta name="description" content="Three.js 기반 3D 모바일 하이퍼캐주얼 디펜스 게임" />
    <meta name="theme-color" content="#4aa8ff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Gate Rush" />
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icons/icon-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icons/apple-touch-icon.png" />
  </head>
  <body>
    <div id="app">
      <div id="canvas-root"></div>

      <!-- HUD (Three.js 캔버스 위에 겹쳐지는 UI 레이어) -->
      <div id="hud" class="hidden">
        <header class="hud-top">
          <div class="top-row">
            <div class="profile">
              <div class="avatar"><span>🙂</span></div>
              <div class="profile-info">
                <div class="profile-name">PLAYER</div>
                <div class="hp-bar player"><div class="hp-fill" id="player-hp-fill"></div><span id="player-hp-text">100</span></div>
              </div>
            </div>
            <div class="score-box">
              <div class="score-label">SCORE</div>
              <div class="score-value" id="score-value">0</div>
            </div>
            <button class="icon-btn" id="pause-btn" aria-label="일시정지">II</button>
          </div>
          <div class="vs-row" id="enemy-list"></div>
        </header>

        <div class="hud-center">
          <div class="unit-badge" id="unit-badge">
            <span class="unit-dot"></span><span id="unit-count">0</span>
          </div>
        </div>

        <footer class="hud-bottom">
          <div class="drag-hint" id="drag-hint">
            <span class="hand">👆</span> 누른 채 좌우로 드래그해 조준 · 발사
          </div>
          <div class="energy-row">
            <div class="energy-bar">
              <div class="energy-fill" id="energy-fill"></div>
              <span class="energy-label">⚡ ENERGY</span>
            </div>
            <button class="power-btn" id="power-btn" disabled>
              <span class="power-icon">💥</span><span class="power-text">POWER</span>
            </button>
          </div>
          <div class="control-zone"><div class="control-track"><div class="control-knob" id="control-knob"></div></div></div>
        </footer>

        <div id="popup-layer"></div>
        <div id="fps" class="hidden"></div>
      </div>

      <!-- 시작 화면 -->
      <div id="screen-start" class="screen">
        <div class="screen-card">
          <div class="logo">
            <span class="logo-top">GATE</span>
            <span class="logo-bottom">RUSH</span>
          </div>
          <p class="subtitle">병력을 증식시켜 적 기지를 무너뜨려라!</p>
          <ul class="howto">
            <li><b>드래그</b> — 대포 좌우 이동 &amp; 발사</li>
            <li><b>게이트</b> — x2 · x3 · x5 · x7 병력 증식</li>
            <li><b>POWER</b> — 에너지가 차면 대량 발사</li>
          </ul>
          <button class="big-btn" id="start-btn">PLAY</button>
          <div class="quality-row">
            그래픽 품질
            <button class="chip" data-quality="low">낮음</button>
            <button class="chip" data-quality="medium">보통</button>
            <button class="chip" data-quality="high">높음</button>
          </div>
        </div>
      </div>

      <!-- 일시정지 -->
      <div id="screen-pause" class="screen hidden">
        <div class="screen-card">
          <h2 class="screen-title">일시정지</h2>
          <button class="big-btn" id="resume-btn">계속하기</button>
          <button class="big-btn secondary" id="restart-btn-pause">다시 시작</button>
        </div>
      </div>

      <!-- 결과 -->
      <div id="screen-result" class="screen hidden">
        <div class="screen-card">
          <h2 class="result-title" id="result-title">VICTORY!</h2>
          <div class="stars" id="result-stars"><span>★</span><span>★</span><span>★</span></div>
          <div class="result-score">SCORE <b id="result-score">0</b></div>
          <div class="result-detail" id="result-detail"></div>
          <button class="big-btn" id="restart-btn">다시 하기</button>
        </div>
      </div>

      <div id="loading" class="screen"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
